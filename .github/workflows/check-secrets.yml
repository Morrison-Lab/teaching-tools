# Thin caller of Morrison-Lab/gha's reusable gitleaks history scan.
#
# History rather than the diff: a secret committed and later removed is still
# exposed, because the orphaned commit stays fetchable through the GitHub API.
# That holds for a private repository too: a leaked credential is still a
# leaked credential to everyone with access.
#
# This repository documents API tokens and session cookies as concepts, so a
# pasted real one is a live risk here. The scan is fast, so it also runs on
# `pull_request`, catching a secret before it reaches `main`.
name: Check for secrets

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays, 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-secrets.yml@v2
