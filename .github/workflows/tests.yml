# Runs the repository's offline tests: the Canvas assignment sync self-test,
# which uses a fake course and makes no network calls.
name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Canvas assignment sync self-test
        run: python3 canvas/tests/test_sync_assignments.py
      - name: Canvas calendar sync self-test
        run: python3 canvas/tests/test_sync_calendar.py
