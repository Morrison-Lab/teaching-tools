# Thin caller of Morrison-Lab/gha's reusable AI-tell scanner.
#
# Warn-only: density is measured per 1,000 words, so one flagged word in a
# short diff can clear the threshold on arithmetic alone.
name: Check AI Tells

on:
  pull_request:
    paths:
      - '**.md'
  workflow_dispatch:

jobs:
  check-ai-tells:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-ai-tells.yml@v2
    with:
      # Scan only the lines this PR adds. Empty on `workflow_dispatch`, which
      # scans the whole tree.
      base-ref: ${{ github.event.pull_request.base.sha }}
      fail: false
